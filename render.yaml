services:
  - type: web
    name: dev-vault-key-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    plan: free
    disk:
      name: key-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ADMIN_TOKEN
        generateValue: true
      - key: KEY_PEPPER
        generateValue: true
      - key: DB_PATH
        value: /var/data/keys.db
      - key: ALLOWED_ORIGINS
        value: "*"
